[project]
name = "finfund"
version = "0.1.0"
description = "Multi-source evidence-driven retrieval-augmented generation for financial question answering"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.10.0", "transformers==4.57.6", "tokenizers==0.22.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests add the source directory to sys.path before importing the package.
"tests/test_framework.py" = ["E402"]
